# Official reference: https://headplane.net/configuration/
# Full config example: https://github.com/tale/headplane/blob/main/config.example.yaml

server:
  host: "0.0.0.0"
  port: 3000
  base_path: "/admin"
  base_url: "http://localhost:3000"
  cookie_secure: true
  cookie_max_age: 86400
  data_path: "/var/lib/headplane"

headscale:
  url: "http://headscale:8080"
  config_path: "/etc/headscale/config.yaml"

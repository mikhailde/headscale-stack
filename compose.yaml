services:
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    restart: unless-stopped
    command: serve
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HEADSCALE_STUN_PORT:-3478}:3478/udp"
    volumes:
      - ./config/headscale.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale
    tmpfs:
      - /var/run/headscale
    environment:
      - HEADSCALE_SERVER_URL=https://${DOMAIN}
      - HEADSCALE_DERP_SERVER_ENABLED=${DERP_SERVER_ENABLED:-false}
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  headplane:
    image: ghcr.io/tale/headplane:latest
    container_name: headplane
    restart: unless-stopped
    depends_on:
      headscale:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config/headplane.yaml:/etc/headplane/config.yaml:ro
      - ./config/headscale.yaml:/etc/headscale/config.yaml:ro
      - headplane-data:/var/lib/headplane
    environment:
      - HEADPLANE_SERVER__BASE_URL=https://${DOMAIN}
      - HEADPLANE_SERVER__COOKIE_SECRET=${HEADPLANE_COOKIE_SECRET}
      - HEADPLANE_HEADSCALE__PUBLIC_URL=https://${DOMAIN}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    profiles:
      - caddy
    depends_on:
      - headscale
      - headplane
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  headscale-data:
  headplane-data:
  caddy-data:
  caddy-config:

networks:
  default:
    name: headscale-net